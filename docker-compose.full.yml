# The whole AGENTX backend from its production images — the same recipe a
# deployment builds — on a Postgres of its own:
#
#   SIGNER_TOKEN=$(openssl rand -hex 24) SIGNER_DEV_PRIVATE_KEY=0x… \
#     docker compose -f docker-compose.full.yml up --build
#
# Separate from docker-compose.yml (the dev database the tests use), on its own
# project, volume and host port, so bringing this up never touches dev data.
# Services start in dependency order and only once what they need is READY:
# postgres → migrate (runs once, must succeed) → signer → api, and the indexer.
name: agentx-full

x-build: &build
  context: .
  dockerfile: Dockerfile
  # The chain facts every image carries — networks, parameters, deployed
  # addresses, ABIs — from the sibling agentx-contracts checkout.
  additional_contexts:
    contracts: ../agentx-contracts

x-chain: &chain
  ENABLED_CHAIN_IDS: ${ENABLED_CHAIN_IDS:-10143}
  DEFAULT_CHAIN_ID: ${DEFAULT_CHAIN_ID:-10143}
  DATABASE_URL: postgres://agentx:agentx@postgres:5432/agentx
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentx
      POSTGRES_PASSWORD: agentx
      POSTGRES_DB: agentx
    ports: ['5443:5432']
    volumes: ['agentx-full-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentx']
      interval: 3s
      retries: 20

  migrate:
    build: {<<: *build, args: {SERVICE: '@agentx/db'}}
    command: ['node', 'bin/migrate.mjs']
    environment:
      DATABASE_URL: postgres://agentx:agentx@postgres:5432/agentx
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  signer:
    build: {<<: *build, args: {SERVICE: '@agentx/signer'}}
    environment:
      <<: *chain
      # With a token the signer listens on every interface — here, only the
      # compose network; it publishes no port.
      SIGNER_TOKEN: ${SIGNER_TOKEN:?set SIGNER_TOKEN (32+ characters), shared with the api}
      SIGNER_KEYSTORE_JSON: ${SIGNER_KEYSTORE_JSON:-}
      SIGNER_KEYSTORE_PASSPHRASE: ${SIGNER_KEYSTORE_PASSPHRASE:-}
      # Testnet only; the signer refuses a raw key anywhere else.
      SIGNER_DEV_PRIVATE_KEY: ${SIGNER_DEV_PRIVATE_KEY:-}
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7070/ready']
      interval: 5s
      retries: 12
    restart: unless-stopped

  indexer:
    build: {<<: *build, args: {SERVICE: '@agentx/indexer'}}
    environment:
      <<: *chain
      INDEXER_HEALTH_PORT: 9090
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/health']
      interval: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: {<<: *build, args: {SERVICE: '@agentx/api'}}
    environment:
      <<: *chain
      SIGNER_URL: http://signer:7070
      SIGNER_TOKEN: ${SIGNER_TOKEN:?set SIGNER_TOKEN (32+ characters), shared with the signer}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports: ['${API_PORT:-8080}:8080']
    depends_on:
      signer: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']
      interval: 5s
      retries: 12
    restart: unless-stopped

volumes:
  agentx-full-pg:
