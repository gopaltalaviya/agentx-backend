# On a public VPS (2 vCPU / 4 GB), on top of docker-compose.full.yml:
#   docker compose -f docker-compose.full.yml -f docker-compose.vps.yml --profile hosted up -d --no-build
#
# Nothing but Caddy listens on the internet: Postgres and the API publish no
# host port (the base file publishes both, right on a laptop, wrong on a
# public address). Caddy terminates TLS and proxies to the API over the
# compose network. The signer never had a port. Images are loaded, not built.
services:
  postgres:
    ports: !reset []
  signer:
    environment:
      # Hosted session keys live 24 h and are renewed in their last 6. A pass
      # can fail on the public RPC's rate limit (seen live, "requests limited
      # to 15/sec"); every 15 min leaves ~24 tries inside the window, not 6.
      SESSION_RENEW_INTERVAL_MS: '900000'
  api:
    ports: !reset []
    environment:
      TRUST_PROXY: '1' # rate limits key on the caller, not on Caddy
  caddy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment:
      API_HOST: ${API_HOST:?set API_HOST, e.g. api.1-2-3-4.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
